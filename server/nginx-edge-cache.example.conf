# Example nginx edge cache in front of NewsNow API (place inside your server {} block).
# Requires TRUST_PROXY=true on Node so rate limits use real client IPs.

# Cache zone — adjust paths/size for your VPS RAM
proxy_cache_path /var/cache/nginx/newsapp levels=1:2 keys_zone=newsapp_api:20m max_size=256m inactive=10m use_temp_path=off;

upstream newsapp_backend {
  server 127.0.0.1:5001;
  keepalive 32;
}

server {
  listen 443 ssl http2;
  server_name api.yourdomain.com;

  # ssl_certificate ...;

  location /api/news/feed {
    proxy_pass http://newsapp_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache newsapp_api;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30s;
    proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_bypass $http_authorization;
    proxy_no_cache $http_authorization;
    add_header X-Cache-Status $upstream_cache_status always;

    proxy_read_timeout 30s;
  }

  location /api/categories {
    proxy_pass http://newsapp_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache newsapp_api;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 5m;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    add_header X-Cache-Status $upstream_cache_status always;
  }

  location /api/ {
    proxy_pass http://newsapp_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}

# Cloudflare (optional): enable "Cache Rules" for GET /api/news/feed* and /api/categories
# with Edge TTL 30s, Bypass cache when Authorization header is present.
