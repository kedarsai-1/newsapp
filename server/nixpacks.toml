# Nixpacks (Railway). Do not set a custom Build Command in the dashboard — this file handles install.
[variables]
NPM_CONFIG_CACHE = "/tmp/npm-cache"
NODE_ENV = "production"
# Avoid heavy ML preload during deploy on small Railway instances (512MB).
POLITICAL_ML_PRELOAD = "false"
POLITICAL_ML_ENABLED = "false"
INGEST_MAX_RUNTIME_MS = "360000"

[phases.install]
cmds = ["npm ci --omit=dev"]

[start]
cmd = "npm start"
